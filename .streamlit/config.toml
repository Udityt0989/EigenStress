[server]
runOnSave = true          # the app reloads automatically when you save a .py file

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#f2f2f2"            # accent is applied only to the Run button via CSS in app.py
backgroundColor = "#0e0e0e"
secondaryBackgroundColor = "#171717"
textColor = "#f2f2f2"
